name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: WindowDayDream.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      # PlatformToolset is overridden to v145 because the windows-latest image
      # (VS 2026) ships MFC libraries only for its default toolset; local builds
      # keep using the toolset pinned in the project files.
      run: >-
        msbuild ${{ env.SOLUTION_FILE_PATH }} /m
        /p:Configuration=${{ env.BUILD_CONFIGURATION }}
        /p:Platform=${{ env.BUILD_PLATFORM }}
        /p:PlatformToolset=v145
        /p:WindowsTargetPlatformVersion=10.0

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: DayDreamMouse-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_CONFIGURATION }}
        path: |
          ${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/*.exe
          ${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/*.dll
        if-no-files-found: error
